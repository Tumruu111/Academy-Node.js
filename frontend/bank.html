<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank</title>
  </head>
  <body>
    <h1>Bank</h1>
    <div>
      <h2>Your Balance<span id="balance"></span></h2>
    </div>
    <button onclick="logout()">Logout</button>
    <button onclick="deposit()">Deposit</button>
    <input type="number" id="depositAmount" placeholder="Enter amount" />
    <button onclick="withdraw()">Withdraw</button>
    <input type="number" id="withdrawAmount" placeholder="Enter amount" />
    <button onclick="history()">History</button>
    <script>
      const userBalance = document.getElementById("balance");
      const loadBalance = async () => {
        const response = await fetch("http://localhost:3000/bank/balance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ balance }),
        });
      };
      const logout = async () => {
        const response = await fetch("http://localhost:3000/user/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });

        if (response.ok) {
          window.location.href = "/login.html";
        } else {
          window.alert("Amjiltgui");
        }
      };
      const deposit = async () => {
        const response = await fetch("http://localhost:3000/bank/deposit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: "number" }),
        });
        const data = await response.json();
        balanceEl.textContent = data.balance;
      };

      const withdraw = async () => {
        const response = await fetch("http://localhost:3000/bank/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: "number" }),
        });
        if (response.ok) {
          const data = await response.json();
          balanceEl.textContent = data.balance;
        } else {
          window.alert("Insufficient funds");
        }
      };
      loadBalance();
    </script>
  </body>
</html>
